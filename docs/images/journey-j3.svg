<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 248" role="img" aria-labelledby="title description">
<title id="title">J3 · Lend a copy</title>
<desc id="description">Acceptance scenarios for lending a physical copy.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:22px;font-weight:700;fill:#fff}.head{font-size:14px;font-weight:700;fill:#334155}.cell{font-size:15px}.grid{stroke:#cbd5e1;stroke-width:1}</style>
<rect width="1480" height="248" fill="#fff"/>
<rect x="0" y="0" width="1480" height="52" rx="9" fill="#1d4ed8"/>
<text x="22" y="34" class="title">J3 · Lend a copy</text>
<rect x="0" y="52" width="1480" height="42" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="16" y="79" class="head">#</text>
<text x="106" y="79" class="head">Scenario</text>
<text x="576" y="79" class="head">What must happen</text>
<rect x="0" y="94" width="1480" height="44" fill="#eff6ff"/>
<text x="16" y="120" class="cell">3.1</text>
<path d="M0 94 V138" class="grid"/>
<text x="106" y="120" class="cell">The copy is on the shelf</text>
<path d="M90 94 V138" class="grid"/>
<text x="576" y="120" class="cell">A loan opens, due in thirty days. The copy leaves the shelf.</text>
<path d="M560 94 V138" class="grid"/>
<path d="M0 138 H1480" class="grid"/>
<rect x="0" y="138" width="1480" height="44" fill="#fff"/>
<text x="16" y="164" class="cell">3.2</text>
<path d="M0 138 V182" class="grid"/>
<text x="106" y="164" class="cell">The copy is already out</text>
<path d="M90 138 V182" class="grid"/>
<text x="576" y="164" class="cell">Refused. The borrower is told the copy is unavailable. No second loan opens.</text>
<path d="M560 138 V182" class="grid"/>
<path d="M0 182 H1480" class="grid"/>
<rect x="0" y="182" width="1480" height="44" fill="#eff6ff"/>
<text x="16" y="208" class="cell">3.3</text>
<path d="M0 182 V226" class="grid"/>
<text x="106" y="208" class="cell">Two borrowers ask for the same copy at the same instant</text>
<path d="M90 182 V226" class="grid"/>
<text x="576" y="208" class="cell">Exactly one loan opens; the other is refused.</text>
<path d="M560 182 V226" class="grid"/>
<path d="M0 226 H1480" class="grid"/>
<rect x="0.75" y="52" width="1478.5" height="185" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
