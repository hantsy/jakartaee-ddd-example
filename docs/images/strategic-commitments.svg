<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 402" role="img" aria-labelledby="title description">
<title id="title">Strategic commitments and implementation</title>
<desc id="description">How strategic design commitments map to code and architecture mechanisms.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:22px;font-weight:700;fill:#fff}.head{font-size:14px;font-weight:700;fill:#334155}.cell{font-size:15px}.grid{stroke:#cbd5e1;stroke-width:1}</style>
<rect width="1450" height="402" fill="#fff"/>
<rect x="0" y="0" width="1450" height="52" rx="9" fill="#2563eb"/>
<text x="22" y="34" class="title">Strategic commitments and implementation</text>
<rect x="0" y="52" width="1450" height="42" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="16" y="79" class="head">Strategic commitment</text>
<text x="456" y="79" class="head">Where it lands</text>
<text x="926" y="79" class="head">Mechanism</text>
<rect x="0" y="94" width="1450" height="44" fill="#eff6ff"/>
<text x="16" y="120" class="cell">1. Keep bibliographic lookup replaceable</text>
<path d="M0 94 V138" class="grid"/>
<text x="456" y="120" class="cell">BookSearchService → OpenLibraryBookSearchService</text>
<path d="M440 94 V138" class="grid"/>
<text x="926" y="120" class="cell">Domain port and CDI adapter</text>
<path d="M910 94 V138" class="grid"/>
<path d="M0 138 H1450" class="grid"/>
<rect x="0" y="138" width="1450" height="44" fill="#fff"/>
<text x="16" y="164" class="cell">2. Keep the contexts&#x27; models separate</text>
<path d="M0 138 V182" class="grid"/>
<text x="456" y="164" class="cell">library.catalog.. / library.lending..</text>
<path d="M440 138 V182" class="grid"/>
<text x="926" y="164" class="cell">Package boundaries enforced by ArchUnit rules 6 and 7</text>
<path d="M910 138 V182" class="grid"/>
<path d="M0 182 H1450" class="grid"/>
<rect x="0" y="182" width="1450" height="44" fill="#eff6ff"/>
<text x="16" y="208" class="cell">3. Use a context-specific copy identifier</text>
<path d="M0 182 V226" class="grid"/>
<text x="456" y="208" class="cell">catalog.domain.CopyId and lending.domain.CopyId</text>
<path d="M440 182 V226" class="grid"/>
<text x="926" y="208" class="cell">Separate types; lending consumes the catalog identity</text>
<path d="M910 182 V226" class="grid"/>
<path d="M0 226 H1450" class="grid"/>
<rect x="0" y="226" width="1450" height="44" fill="#fff"/>
<text x="16" y="252" class="cell">4. Keep event coupling in one place</text>
<path d="M0 226 V270" class="grid"/>
<text x="456" y="252" class="cell">DomainEventListener</text>
<path d="M440 226 V270" class="grid"/>
<text x="926" y="252" class="cell">ArchUnit rule 7 allows this dependency</text>
<path d="M910 226 V270" class="grid"/>
<path d="M0 270 H1450" class="grid"/>
<rect x="0" y="270" width="1450" height="44" fill="#eff6ff"/>
<text x="16" y="296" class="cell">5. Update shelf status from loan events</text>
<path d="M0 270 V314" class="grid"/>
<text x="456" y="296" class="cell">Copy.available</text>
<path d="M440 270 V314" class="grid"/>
<text x="926" y="296" class="cell">CDI observer methods handle LoanCreated and LoanClosed</text>
<path d="M910 270 V314" class="grid"/>
<path d="M0 314 H1450" class="grid"/>
<rect x="0" y="314" width="1450" height="66" fill="#fff"/>
<text x="16" y="340" class="cell">6. Keep the external adapter out of application</text>
<text x="16" y="362" class="cell">code</text>
<path d="M0 314 V380" class="grid"/>
<text x="456" y="340" class="cell">library.catalog.infrastructure</text>
<path d="M440 314 V380" class="grid"/>
<text x="926" y="340" class="cell">ArchUnit rule 3 prevents application-to-infrastructure</text>
<text x="926" y="362" class="cell">dependencies</text>
<path d="M910 314 V380" class="grid"/>
<path d="M0 380 H1450" class="grid"/>
<rect x="0.75" y="52" width="1448.5" height="339" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
</svg>
