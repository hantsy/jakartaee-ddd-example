<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 336" role="img" aria-labelledby="title description">
<title id="title">J5 · The overdue fee</title>
<desc id="description">Flat overdue-fee tiers based on how many days late a copy is returned.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:22px;font-weight:700;fill:#fff}.head{font-size:14px;font-weight:700;fill:#334155}.cell{font-size:15px}.grid{stroke:#cbd5e1;stroke-width:1}</style>
<rect width="1480" height="336" fill="#fff"/>
<rect x="0" y="0" width="1480" height="52" rx="9" fill="#7e22ce"/>
<text x="22" y="34" class="title">J5 · The overdue fee</text>
